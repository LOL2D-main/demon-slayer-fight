<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="game-container">
  <div class="overlay-container">
    <!-- Player Health -->
    <div class="health-bar">
      <div class="health-background"></div>
      <div id="playerHealth" class="health-fill"></div>
    </div>

    <!-- Timer -->
    <div id="timer">100</div>

    <!-- Enemy Health -->
    <div class="health-bar">
      <div class="health-background"></div>
      <div id="enemyHealth" class="health-fill"></div>
    </div>
  </div>

  <!-- Game Result -->
  <div id="resultOfGame">Tie</div>

  <!-- Canvas for the game -->
  <canvas></canvas>
</div>

<div class="instructions">
  NOTE: How To Play ? <br />
  Player 1 : can use (q, space, e, r) to fight && (w, a, d) to move and jump <br />
  Player 2 : can use (arrow-down, <b>,</b>, ., /) && (arrow-right, arrow-left, arrow-up) to move and jump
</div>

<script src="./js/utls.js"></script>
<script src="./js/classes.js"></script>
<script src="./index.js"></script>
</body>
</html>
